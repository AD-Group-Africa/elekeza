services:
  ai-service:
    build: .
    container_name: ai-elekeza-test
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      TESSERACT_CMD: ""
      LANGFUSE_HOST: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
