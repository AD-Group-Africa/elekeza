[pytest]
asyncio_mode = auto
timeout = 120
markers =
    live: marks tests as live integration tests requiring a running server and API key
    live_full: full live-provider matrix (54+ real LLM calls) — run explicitly with: pytest -m live_full
# Safe default: plain `pytest` never executes the full live-provider matrix.
# An explicit CLI -m overrides this (pytest -m is last-wins), so
# `pytest -m live` and `pytest -m live_full` still work as intended.
addopts = -m "not live_full"