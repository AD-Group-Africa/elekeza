version: '3.8'

services:
  # 1. Your Python AI Microservice
  ai-service:
    build: .
    container_name: accessibledocs-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # CRITICAL: This maps your local folders to the container. 
      # If you don't do this, your ChromaDB vector database will be 
      # permanently deleted every time you restart the container!
      - ./chroma_db:/app/chroma_db
      - ./temp_uploads:/app/temp_uploads
      - .:/app
    networks:
      - accessibledocs-network

  # for backend development, you can uncomment this to run the Spring Boot API in Docker as well.
  # springboot-api:
  #   build: ../accessibledocs-springboot  
  #   container_name: accessibledocs-springboot
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - ai-service
  #   networks:
  #     - accessibledocs-network

networks:
  # This creates a shared private network so Spring Boot can send 
  # documents to http://ai-service:8000 without leaving Docker.
  accessibledocs-network:
    driver: bridge