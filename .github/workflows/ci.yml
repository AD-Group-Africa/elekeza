name: CI

# Elekeza continuous verification.
#
#  - backend:   full Kotlin test suite (includes authorization/tenant-isolation tests)
#  - frontend:  typecheck + lint + Vitest unit tests
#  - e2e:       Playwright suite against the REAL stack — backend boot JAR with the
#               dev profile on in-memory H2 (fresh deterministic seed per run) and the
#               Next.js dev server proxying /api. Includes the axe-core accessibility
#               gate and the role route-crawl.
#
# No external credentials required: dev profile uses in-memory H2 and provider
# adapters fall back to local mock behavior.

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --console=plain
      - name: Production build (bootJar)
        working-directory: backend
        run: ./gradlew bootJar --console=plain
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npx vitest run
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8085

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E suite (journeys + exam + offline + a11y + route crawl)
        run: npx playwright test
        env:
          E2E_BACKEND_PORT: 8090
          E2E_FRONTEND_PORT: 3100
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  ai-elewa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-elewa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-elewa/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Boot AI service (in-process, deterministic config)
        # test_error_handling.py and test_edge_cases.py are live-server tests:
        # they call the HTTP API on localhost:8000. CI boots uvicorn exactly as
        # a local developer would. No real provider calls occur for these.
        run: |
          uvicorn main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/health > /dev/null || (cat uvicorn.log && exit 1)
        env:
          # Dummy provider env: config.py fails fast at import without these.
          # No real provider calls occur in the non-live suite.
          AI_PROVIDER: groq
          AI_API_KEY: ci-dummy-not-a-real-key
          INTERNAL_SECRET: elekeza-test-internal-key-not-a-secret
          LANGFUSE_HOST: ""
      - name: Run AI unit + contract + live-server tests (credential-free)
        # test_full_pipeline.py is marked `live_full`: it asserts against the
        # real AI provider and needs genuine AI_API_KEY credentials, so CI
        # skips it via -m. The small credential-gated smoke set
        # (tests/test_live_smoke.py, marker `live`) is excluded by the same
        # expression. pytest.ini addopts also excludes live_full by default.
        run: python -m pytest tests -q -m "not live and not live_full"
      - name: Upload AI test summary on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-elewa-test-output
          path: ai-elewa/test-results.xml
          if-no-files-found: ignore
