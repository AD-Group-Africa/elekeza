name: CI

# Elekeza continuous verification.
#
#  - backend:   full Kotlin test suite (includes authorization/tenant-isolation tests)
#  - frontend:  typecheck + lint + Vitest unit tests
#  - e2e:       Playwright suite against the REAL stack — backend boot JAR with the
#               dev profile on in-memory H2 (fresh deterministic seed per run) and the
#               Next.js dev server proxying /api. Includes the axe-core accessibility
#               gate and the role route-crawl.
#
# No external credentials required: dev profile uses in-memory H2 and provider
# adapters fall back to local mock behavior.

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --console=plain
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npx vitest run
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E suite (journeys + exam + offline + a11y + route crawl)
        run: npx playwright test
        env:
          E2E_BACKEND_PORT: 8090
          E2E_FRONTEND_PORT: 3100
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
