services:
  postgres:
    image: postgres:16-alpine
    container_name: elewa-postgres
    environment:
      POSTGRES_DB: accessibledocs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: elewa-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DB_PASSWORD:-password}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change-me-shared-secret}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-elewa
    container_name: elewa-ai
    ports:
      - "8000:8000"
    environment:
      AI_PROVIDER: groq
      AI_API_KEY: ${GROQ_API_KEY}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change-me-shared-secret}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: elewa-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
