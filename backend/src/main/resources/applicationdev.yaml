# ============================================================
# DEV profile — activate with: -Dspring.profiles.active=dev
# or SPRING_PROFILES_ACTIVE=dev in your .env
# ============================================================

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Use local Postgres for dev — no Supabase required
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:accessibledocs}

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001

mpesa:
  sandbox: true

logging:
  level:
    com.elekeza: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG