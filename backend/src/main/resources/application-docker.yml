spring:
  datasource:
    # Compose contract: DB_URL / DB_USER / DB_PASSWORD (see docker-compose.yml).
    # Fallbacks preserve the original docker-profile defaults for image users
    # who set nothing (postgres@postgres:5432/accessibledocs).
    url: ${DB_URL:jdbc:postgresql://postgres:5432/accessibledocs}
    username: ${DB_USER:${DB_USERNAME:postgres}}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # Demo seed gate (V2__seed_demo.sql): docker deployments default to demo
    # seeding OFF. Set DEMO_SEED_ENABLED=true only for a demo stack.
    placeholders:
      demoSeedEnabled: "${DEMO_SEED_ENABLED:FALSE}"

management:
  health:
    mail:
      # SMTP is an optional fail-safe integration (EMAIL_PROVIDER=mock by default);
      # an unconfigured MAIL_HOST must not mark the whole platform DOWN
      # (it blocks `docker compose up --wait` and ops alerting).
      enabled: false

ai:
  base-url: ${AI_SERVICE_URL:http://ai-service:8000}
  internal-secret: ${AI_INTERNAL_SECRET}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
  client:
    # AiClient is a required dependency — without this the app fails to start.
    type: ${AI_CLIENT_TYPE:real}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://frontend:3000}

jwt:
  secret: ${JWT_SECRET:change-me-32-char-minimum-secret-key}
