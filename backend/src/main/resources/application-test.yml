spring:
  main:
    web-application-type: servlet

  # Inline test data configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    # Wave 0 (SEC-P0-03): the base profile now defaults demo seeding to OFF.
    # This profile exists only to run the suite, so the demo fixtures stay ON
    # here and nowhere else. DemoSeedGuard permits it for the test profile.
    placeholders:
      demoSeedEnabled: "${DEMO_SEED_ENABLED:TRUE}"

  # Test-specific settings
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  # Mock M-Pesa configuration for tests
  profiles:
    active: default

# M-Pesa test mode
mpesa:
  environment: test
  consumer-key: test-key
  consumer-secret: test-secret
  passkey: test-passkey
  shortcode: 174379
  callback-url: http://localhost:8085/api/payments/callback