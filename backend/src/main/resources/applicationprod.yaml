spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  datasource:
    # Combined your Supabase info into a clean JDBC URL
    url: jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:6543/postgres
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

app:
  frontend-url: ${FRONTEND_URL}
  auth:
    token-secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
