# ============================================================
# PROD profile — set SPRING_PROFILES_ACTIVE=prod in Railway/Render
# ============================================================

spring:
  jpa:
    show-sql: false

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    hikari:
      maximum-pool-size: 20

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  cors:
    allowed-origins: https://elekeza.app,https://www.elekeza.app,https://staging.elekeza.app

mpesa:
  sandbox: false

logging:
  level:
    root: INFO
    com.elekeza: INFO
    org.springframework: WARNw
