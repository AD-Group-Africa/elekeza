spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: placeholder@example.com
    password: placeholder

management:
  health:
    mail:
      enabled: false

ai:
  client-type: ${AI_CLIENT_TYPE}
  base-url: ${AI_SERVICE_URL}
  internal-secret: ${AI_INTERNAL_SECRET}
  timeout-seconds: 120

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}

mpesa:
  callback-url: https://placeholder.callback

