spring:
  application:
    name: elekeza-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@elekeza.app}
    password: ${MAIL_PASSWORD:unused}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # Disable OAuth2 autoconfiguration when Google credentials are not provided
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 604800000

ai:
  base-url: ${AI_SERVICE_URL:http://ai-service:8000}
  internal-secret: ${AI_INTERNAL_SECRET:change-me}
  timeout-seconds: 60
  client:
    type: ${AI_CLIENT_TYPE:real}

google:
  client-id: ${GOOGLE_CLIENT_ID:442000591516-2c4fkqj14727fjooo1vtjue768ociucd.apps.googleusercontent.com}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:uploads}
  secure-cookies: ${SECURE_COOKIES:true}


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.elekeza: INFO



