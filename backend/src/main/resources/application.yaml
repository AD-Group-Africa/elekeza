spring:
  application:
    name: elekeza-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # NEVER use 'update' in production — use validate + Flyway
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000        # 15 minutes
  refresh-expiration: 604800000  # 7 days

# Single AI service config (removed duplicate fastapi.* block)
ai:
  base-url: ${AI_SERVICE_URL}
  internal-secret: ${AI_INTERNAL_SECRET}

mpesa:
  consumer-key: ${MPESA_CONSUMER_KEY:placeholder}
  consumer-secret: ${MPESA_CONSUMER_SECRET:placeholder}
  pass-key: ${MPESA_PASS_KEY:placeholder}
  short-code: ${MPESA_SHORT_CODE:174379}
  callback-url: ${MPESA_CALLBACK_URL}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  frontend-url: ${FRONTEND_URL}
  upload-dir: uploads

# Actuator — health only, no sensitive exposure
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.elekeza: INFO
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%p","logger":"%logger{36}","msg":"%m"}%n'