spring:
  application:
    name: elekeza-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/accessibledocs
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2634Hp$$}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars!!}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
    cookie-name: ELEKEZA_access
    refresh-cookie-name: ELEKEZA_refresh

fastapi:
  base-url: ${FASTAPI_URL:http://localhost:8001}
  # Must match INTERNAL_SECRET in Alvin's .env â€” never commit the real value
  internal-secret: ${INTERNAL_SECRET:change-me-shared-secret}
  timeout-seconds: 30


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ELEKEZA.backend: DEBUG
    org.springframework.security: INFO
    org.springframework.web: DEBUG

ai:
  client:
    type: real

