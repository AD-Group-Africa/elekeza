spring:
  application:
    name: elekeza-backend

  datasource:
    url: jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:6543/postgres?sslmode=require
    username: "postgres.ptrwshzwyaxmjxqpcuus"
    password: "2634Hp$$HM22"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile

# ── JWT Config (Matches @Value("${jwt.secret}")) ──────────────────────────────
jwt:
  secret: "elekeza-mastercard-demo-secret-key-2026-secure"
  cookie-name: ${SECURITY_JWT_COOKIE_NAME:elekeza_access}
  refresh-cookie-name: ${SECURITY_JWT_REFRESH_COOKIE_NAME:elekeza_refresh}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

# ── Other Services ────────────────────────────────────────────────────────────
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}
  internal-secret: ${INTERNAL_AI_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  upload-dir: uploads

logging:
  level:
    root: INFO
    com.elekeza: DEBUG

fastapi:
  base-url: ${FASTAPI_URL:http://localhost:8000}
  internal-secret: ${FASTAPI_INTERNAL_SECRET:your-super-secret-key-here}

ai:
  internal-secret: ${AI_INTERNAL_SECRET:your-ai-secret-key-here}

mpesa:
  consumer-key: ${MPESA_CONSUMER_KEY:your_key_here}
  consumer-secret: ${MPESA_CONSUMER_SECRET:your_secret_here}
  pass-key: ${MPESA_PASS_KEY:your_passkey_here}
  short-code: ${MPESA_SHORT_CODE:174379}
  callback-url: ${MPESA_CALLBACK_URL:https://yourdomain.com/callback}