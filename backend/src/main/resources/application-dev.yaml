spring:
  datasource:
    url: jdbc:h2:mem:elekeza;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        enabled: false
  mail:
    host: localhost
    port: 1025
    username: unused
    password: unused

jwt:
  secret: dev-secret-at-least-32-characters-long!!
  expiration: 900000
  refresh-expiration: 604800000

ai:
  client:
    type: mock
  base-url: http://localhost:8000
  internal-secret: dev-internal-secret-change-in-prod
  timeout-seconds: 60

app:
  frontend-url: http://localhost:3000
  cors:
    allowed-origins: "*"

mpesa:
  consumer-key: dev-key
  consumer-secret: dev-secret
  pass-key: dev-pass
  short-code: 174379
  callback-url: http://localhost:9090/mpesa/callback

management:
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.elekeza: DEBUG