spring:
  datasource:
    url: jdbc:h2:mem:elekeza;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        enabled: false
  mail:
    host: localhost
    port: 1025
    username: unused
    password: unused

jwt:
  secret: dev-secret-at-least-32-characters-long!!
  expiration: 900000
  refresh-expiration: 604800000
ai:
  client:
    type: real
  base-url: https://elekeza-ai.onrender.com
  internal-secret: ${AI_INTERNAL_SECRET:change-me}
  timeout-seconds: 120

app:
  frontend-url: http://localhost:3000
  cors:
    allowed-origins: "*"

mpesa:
  consumer-key: 7BTGmPEGK6ZTHa87dY46KjjEDXJmSti2nhW26FKPBpO9eHaU
  consumer-secret: rs6GOYBkI2LhA2QUTL3AG5X7APCeHY2buJgSp5ziRvnMsb5dZyUzDszy9s11p8uJ
  passkey: dev-pass
  shortcode: 174379
  callback-url: http://localhost:8080/api/payments/callback
  environment: sandbox

africastalking:
