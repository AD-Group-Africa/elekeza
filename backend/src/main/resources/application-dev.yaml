spring:
  datasource:
    url: jdbc:h2:mem:elekeza;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        enabled: false
  mail:
    host: localhost
    port: 1025
    username: unused
    password: unused

jwt:
  secret: ${JWT_SECRET:dev-secret-at-least-32-characters-long!!}
  expiration: 900000
  refresh-expiration: 604800000
ai:
  client:
    type: ${AI_CLIENT_TYPE:mock}
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  # Local-dev default so `./gradlew bootRun --args='--spring.profiles.active=dev'`
  # boots without extra env vars. Production never uses the dev profile.
  internal-secret: ${AI_INTERNAL_SECRET:dev-internal-secret-not-for-production}
  timeout-seconds: 120

app:
  frontend-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000
  secure-cookies: false

mpesa:
  consumer-key: ${MPESA_CONSUMER_KEY:}
  consumer-secret: ${MPESA_CONSUMER_SECRET:}
  passkey: ${MPESA_PASSKEY:}
  shortcode: ${MPESA_SHORTCODE:174379}
  callback-url: ${MPESA_CALLBACK_URL:http://localhost:8080/api/payments/callback}
  environment: sandbox

management:
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.elekeza: DEBUG
