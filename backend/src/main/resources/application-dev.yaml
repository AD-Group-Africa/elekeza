# application-dev.yaml
# This file is safe to commit — it contains NO secrets.
# Run with: SPRING_PROFILES_ACTIVE=dev ./gradlew bootRun

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/elekeza_dev
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update   # OK locally — not in prod
    show-sql: true

  flyway:
    enabled: false       # Let Hibernate manage schema locally

jwt:
  secret: dev-only-secret-do-not-use-in-production-ever

ai:
  base-url: http://localhost:8000
  internal-secret: dev-ai-secret

app:
  cors:
    allowed-origins: http://localhost:3000
  frontend-url: http://localhost:3000

logging:
  level:
    root: DEBUG
    com.elekeza: DEBUG