spring:
  datasource:
    url: jdbc:h2:mem:elekeza;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

jwt:
  secret: dev-secret-at-least-32-characters-long!!
  expiration: 900000
  refresh-expiration: 604800000

ai:
  base-url: http://localhost:8000
  internal-secret: dev-internal-secret

app:
  frontend-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000

mpesa:
  consumer-key: dev-key
  consumer-secret: dev-secret
  pass-key: dev-pass
  short-code: 174379
  callback-url: http://localhost:8080/mpesa/callback
