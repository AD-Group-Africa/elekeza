worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;   # Allow PDF/DOCX uploads up to 50 MB

    # Gzip for API + static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Upstream definitions
    upstream backend  { server backend:8080;  keepalive 16; }
    upstream frontend { server frontend:3000; keepalive 16; }

    # ── HTTP — redirect everything to HTTPS ──────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge (certbot webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — main server ──────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name elekeza.app www.elekeza.app;   # Replace with your actual domain

        # TLS certificates (managed by Certbot / Let's Encrypt)
        ssl_certificate     /etc/letsencrypt/live/elekeza.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/elekeza.app/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── API routes → Spring Boot backend ─────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Longer timeout for AI processing (document upload → simplify can take 30s)
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Actuator health (public, backend only)
        location /actuator/health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # ── All other routes → Next.js frontend ──────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade     $http_upgrade;
            proxy_set_header   Connection  "upgrade";
            proxy_set_header   Host        $host;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Static asset caching (Next.js /_next/static) ─────────────────────
        location /_next/static/ {
            proxy_pass http://frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── PWA service worker — no-cache ─────────────────────────────────────
        location /sw.js {
            proxy_pass http://frontend;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
